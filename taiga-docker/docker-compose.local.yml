version: "3.5"

x-volumes:
  &local-back-volumes
  - ../taiga-back:/taiga-back
  - taiga-static-data:/taiga-back/static
  - taiga-media-data:/taiga-back/media

services:
  taiga-back:
    build:
      context: ../taiga-back
      dockerfile: docker/Dockerfile
    entrypoint: ["/bin/bash", "/taiga-back/docker/entrypoint.sh"]
    volumes: *local-back-volumes

  taiga-async:
    build:
      context: ../taiga-back
      dockerfile: docker/Dockerfile
    entrypoint: ["/bin/bash", "/taiga-back/docker/async_entrypoint.sh"]
    volumes: *local-back-volumes

  taiga-front:
    image: node:16-bullseye
    working_dir: /taiga-front
    environment:
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "1000"
    command:
      - /bin/bash
      - -lc
      - >
        if [ ! -d node_modules ] || [ ! -f node_modules/.package-lock.json ] || ! cmp -s package-lock.json node_modules/.package-lock.json; then
          npm ci --legacy-peer-deps &&
          cp package-lock.json node_modules/.package-lock.json;
        fi;
        mkdir -p dist;
        ln -sf /taiga-front/conf/conf.example.json /taiga-front/dist/conf.json;
        npm start
    volumes:
      - ../taiga-front:/taiga-front
      - taiga-front-node-modules:/taiga-front/node_modules
      - ./conf.front.dev.json:/taiga-front/conf/conf.example.json:ro

  taiga-manage:
    build:
      context: ../taiga-back
      dockerfile: docker/Dockerfile
    volumes: *local-back-volumes

  taiga-gateway:
    volumes:
      - ./taiga-gateway/taiga.local.conf:/etc/nginx/conf.d/default.conf
      - taiga-static-data:/taiga/static
      - taiga-media-data:/taiga/media

volumes:
  taiga-front-node-modules:
